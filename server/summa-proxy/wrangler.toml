name = "summa-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret config. Secrets (ANTHROPIC_API_KEY, SUMMA_ACCESS_TOKENS,
# SUMMA_SESSION_SECRET, SUMMA_ALLOWED_EMAILS) are set with `wrangler secret put`
# so they never live in this file / the repo.
[vars]
ANNOTATION_MODEL = "claude-sonnet-4-6"
APPLE_BUNDLE_ID = "com.josephruocco.ScreenGlossMVP"
MAX_TEXT_CHARS = "12000"
# Soft daily request cap for beta codes: per user (by IP), and a global ceiling
# across all beta traffic so a viral day can't run up the bill. Full-access
# codes and API-key users are uncapped.
BETA_DAILY_CAP = "40"
BETA_GLOBAL_CAP = "1500"

# Per-code daily usage counters for the beta cap.
[[kv_namespaces]]
binding = "USAGE"
id = "d62cdc20b3794e0a914ed00b3677648b"
